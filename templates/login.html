<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Unidesk International</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #05050a; color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        .cyber-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-image: linear-gradient(to right, rgba(99, 102, 241, 0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(99, 102, 241, 0.1) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(60deg); transform-origin: top center; z-index: -2; }
        .orb { position: absolute; width: 400px; height: 400px; background: #6366f1; filter: blur(150px); opacity: 0.2; z-index: -1; border-radius: 50%; }
        
        .login-card { background: rgba(15, 15, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); padding: 40px; border-radius: 24px; width: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(99, 102, 241, 0.2); }
        h2 { text-align: center; color: #fff; margin-bottom: 25px; font-weight: 700; font-size: 26px; }
        h2 span { background: linear-gradient(135deg, #818cf8, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        label { font-size: 13px; color: #94a3b8; font-weight: 500; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 16px; margin-bottom: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        
        button { width: 100%; padding: 13px; background: linear-gradient(135deg, #6366f1, #3b82f6); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(99,102,241,0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99,102,241,0.6); }
        
        .error { color: #f87171; text-align: center; font-size: 13px; margin-bottom: 15px; background: rgba(248, 113, 113, 0.1); padding: 8px; border-radius: 8px; }
        .switch-link { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
        .switch-link a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .switch-link a:hover { text-decoration: underline; }
        .back-home { text-align: center; margin-top: 15px; font-size: 12px; }
        .back-home a { color: #64748b; text-decoration: none; }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="orb"></div>

    <div class="login-card">
        <h2>Unidesk <span>Portal</span></h2>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if action == 'login' %}
        <!-- LOGIN FORM -->
        <form method="POST">
            <input type="hidden" name="form_type" value="login">
            <label>Username / Email</label>
            <input type="text" name="username" required placeholder="Enter your username">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
            <button type="submit">Login to Portal</button>
        </form>
        <div class="switch-link">
            Don't have an account? <a href="/login?action=register">Create Account</a>
        </div>

        {% elif action == 'register' %}
        <!-- REGISTER FORM (GMAIL OTP) -->
        <form method="POST">
            <input type="hidden" name="form_type" value="register">
            <label>Email Address (Gmail)</label>
            <input type="email" name="email" required placeholder="yourname@gmail.com">
            <button type="submit">Send Gmail OTP</button>
        </form>
        <div class="switch-link">
            Already have an account? <a href="/login?action=login">Login here</a>
        </div>

        {% elif action == 'verify_otp' %}
        <!-- OTP & PASSWORD SETUP FORM -->
        <form method="POST">
            <input type="hidden" name="form_type" value="verify">
            <input type="hidden" name="email" value="{{ email }}">
            <label>Enter 6-digit OTP sent to {{ email }}</label>
            <input type="text" name="otp" required placeholder="123456">
            <label>Create New Password</label>
            <input type="password" name="new_password" required placeholder="••••••••">
            <button type="submit">Verify & Create Account</button>
        </form>
        {% endif %}

        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>
    </div>
</body>
</html>
